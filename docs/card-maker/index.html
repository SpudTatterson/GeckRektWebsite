<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Card Maker | Geck REKT</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Roboto;src:url('/fonts/Roboto-VariableFont_wdth,wght.ttf');font-weight:100 900}
*{box-sizing:border-box}body{margin:0;background:#22252d;color:#f0f0f0;font:15px Roboto,Arial,sans-serif}header{padding:24px 32px;border-bottom:1px solid #ffffff24;display:flex;align-items:center;gap:16px}header img{width:42px;border-radius:8px}h1{margin:0;font:28px 'Lilita One',sans-serif;text-transform:uppercase}header p{margin:4px 0 0;color:#acafb9}header a{margin-left:auto;color:#e67e22}main{display:grid;grid-template-columns:350px minmax(0,1fr);min-height:calc(100vh - 95px)}aside{padding:24px;background:#2a2d36}fieldset{border:0;padding:0;margin:0 0 24px}legend{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#e67e22;font-weight:800;margin-bottom:14px}label{display:block;font-size:13px;margin-bottom:12px}input,textarea,select,button{font:inherit}input:not([type=checkbox]),textarea,select{display:block;width:100%;margin-top:6px;padding:9px;background:#20232b;border:1px solid #ffffff30;border-radius:5px;color:#fff}textarea{resize:vertical;min-height:80px}input[type=color]{height:38px;padding:3px}input[type=checkbox]{accent-color:#e67e22}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{cursor:pointer;border:1px solid #ffffff30;border-radius:5px;background:#363a45;color:white;padding:11px 16px;font-weight:700}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #e67e22;outline-offset:3px}.primary{background:#e67e22;color:#20232b;border:0;width:100%;font-weight:850}.preview{padding:32px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:24px}.preview-heading{display:flex;justify-content:space-between;width:100%;gap:16px;color:#acafb9;font-size:13px}.stage{width:100%;flex:1;min-height:360px;display:flex;align-items:center;justify-content:center;background-color:#30333c;background-image:linear-gradient(45deg,#ffffff06 25%,transparent 25%),linear-gradient(-45deg,#ffffff06 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff06 75%),linear-gradient(-45deg,transparent 75%,#ffffff06 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;border:1px solid #ffffff15;border-radius:8px;padding:24px}canvas{display:block;max-width:100%;height:auto}.hint{color:#acafb9;font-size:13px;line-height:1.5;margin:0}#status{min-height:20px;font-size:13px;color:#f3c799}details{margin-bottom:24px}summary{cursor:pointer;color:#e67e22;margin-bottom:16px} @media(max-width:780px){main{grid-template-columns:1fr}.preview{grid-row:1;padding:20px}.stage{min-height:240px}header{padding:20px}header p{font-size:12px}header a{font-size:12px}}
</style>
</head>
<body>
<header><img src="/geck-rekt/LogoBox.png" alt=""><div><h1>Card maker</h1><p>Geck REKT’s red cards, ready to share.</p></div><a href="/">Back to site</a></header>
<main>
<aside><form id="controls" onsubmit="return false">
<fieldset><legend>01 / Content</legend>
<label>Start from a site card<select id="preset"><option value="0">Same couch. Or miles apart.</option><option value="1">Change the rules.</option><option value="2">Win them over. Literally.</option><option value="3">Weaponize your tongue.</option><option value="4">Out of bullets? No worries.</option><option value="5">Make the arena your arsenal.</option></select></label>
<label>Header<textarea id="heading"></textarea></label><label>Body<textarea id="body" rows="5"></textarea></label>
<p class="hint">Use line breaks to place text exactly where you want it.</p></fieldset>
<fieldset><legend>02 / Layout · pixels</legend>
<label>Card width<input id="width" type="number" min="200" max="2000"></label>
<div class="row"><label>Top margin<input id="top" type="number" min="0" max="300"></label><label>Bottom margin<input id="bottom" type="number" min="0" max="300"></label></div>
<div class="row"><label>Left margin<input id="left" type="number" min="0" max="300"></label><label>Right margin<input id="right" type="number" min="0" max="300"></label></div>
<div class="row"><label>Header size<input id="headingSize" type="number" min="12" max="150"></label><label>Body size<input id="bodySize" type="number" min="10" max="100"></label></div>
<div class="row"><label>Text gap<input id="gap" type="number" min="0" max="200"></label><label>Rotation (degrees)<input id="rotation" type="number" min="-20" max="20" step="0.5"></label></div>
<label>Text alignment<select id="align"><option>left</option><option>center</option><option>right</option></select></label></fieldset>
<details><summary>Typography &amp; colors</summary>
<div class="row"><label>Header line height<input id="headingLine" type="number" min="0.8" max="3" step="0.05"></label><label>Body line height<input id="bodyLine" type="number" min="0.8" max="3" step="0.05"></label></div>
<div class="row"><label>Card color<input id="fill" type="color"></label><label>Border color<input id="border" type="color"></label><label>Text color<input id="text" type="color"></label><label>Border width<input id="borderWidth" type="number" min="0" max="20"></label></div>
<label><input id="uppercase" type="checkbox"> Uppercase header</label><label><input id="shadow" type="checkbox"> Site-style shadow</label></details>
<fieldset><legend>03 / Export</legend><label>PNG resolution<select id="scale"><option value="1">1× · original size</option><option value="2">2× · high resolution</option><option value="3">3× · extra high resolution</option></select></label><label><input id="transparent" type="checkbox"> Transparent background</label><label id="backgroundLabel">Background color<input id="background" type="color"></label></fieldset>
<button class="primary" id="download" type="button">Download PNG ↓</button><p id="status" role="status" aria-live="polite"></p><button id="reset" type="button">Reset to site style</button>
</form></aside>
<section class="preview" aria-label="Card preview"><div class="preview-heading"><span>LIVE PREVIEW</span><span id="dimensions"></span></div><div class="stage"><canvas id="canvas" aria-label="Your card preview"></canvas></div><p class="hint">The PNG includes the full tilted card and shadow. Your settings are saved in this browser.</p></section>
</main>
<script>
'use strict';
const presets=[['Same couch. Or miles apart.','Bring 2–4 players together for couch or online multiplayer. Steal their guns, settle your disagreements, and give your friends something to shout about.'],['Change the rules. Survive the consequences.','Every few rounds, vote on modifiers that shake up the fight. Meteor showers, exploding bodies, or nothing but rocket launchers. Pick your next problem and adapt fast, or get rekt.'],['Win them over. Literally.','Your friends voted for something else? Pull them onto your choice with your tongue. Democracy takes a little persuasion.'],['Weaponize your tongue.','They grabbed the gun first? You’re still in the fight. Disarm them with a lick and fling them across the arena. A Geck is never out of tricks.'],['Out of bullets? No worries.','Throw your gun at your friend and steal theirs. Who needs a reload when someone else brought the ammo?'],['Make the arena your arsenal.','Grab rocks and barrels with your tongue and send them flying. Your next weapon could be sitting right beside you.']];
const defaults={heading:presets[0][0],body:presets[0][1],width:480,top:26,bottom:26,left:28,right:28,headingSize:37,bodySize:16,gap:14,rotation:-3,align:'left',headingLine:1.05,bodyLine:1.55,fill:'#d04c2b',border:'#e67e22',text:'#ffffff',borderWidth:2,uppercase:true,shadow:true,scale:'2',transparent:true,background:'#33343a'};
const el=id=>document.getElementById(id), canvas=el('canvas'), ctx=canvas.getContext('2d');
let state={...defaults},fontReady=false;
try{const saved=JSON.parse(localStorage.getItem('geck-card-maker'));if(saved&&typeof saved==='object')Object.keys(defaults).forEach(k=>{if(typeof saved[k]===typeof defaults[k])state[k]=saved[k]})}catch(e){/* Storage may be unavailable. */}
function populate(){Object.keys(defaults).forEach(k=>{if(typeof defaults[k]==='boolean')el(k).checked=state[k];else el(k).value=state[k]})}
function read(){Object.keys(defaults).forEach(k=>{const input=el(k);if(typeof defaults[k]==='boolean')state[k]=input.checked;else if(typeof defaults[k]==='number'){const n=input.valueAsNumber;state[k]=Number.isFinite(n)?Math.max(+input.min,Math.min(+input.max,n)):defaults[k]}else state[k]=input.value});try{localStorage.setItem('geck-card-maker',JSON.stringify(state))}catch(e){/* Keep editing without persistence. */}}
function lines(text,width){const result=[];text.split('\n').forEach(paragraph=>{let line='';for(const word of paragraph.split(/\s+/).filter(Boolean)){if(ctx.measureText(line?line+' '+word:word).width<=width){line=line?line+' '+word:word;continue}if(line){result.push(line);line=''}for(const ch of word){if(line&&ctx.measureText(line+ch).width>width){result.push(line);line=''}line+=ch}}result.push(line)});return result}
function render(){const s=state,w=s.width,b=s.borderWidth;const inner=Math.max(20,w-s.left-s.right-b*2);ctx.font=s.headingSize+'px "Lilita One",Roboto,sans-serif';const title=s.heading?lines(s.uppercase?s.heading.toUpperCase():s.heading,inner):[];ctx.font=s.bodySize+'px Roboto,sans-serif';const body=s.body?lines(s.body,inner):[];const th=title.length*s.headingSize*s.headingLine,bh=body.length*s.bodySize*s.bodyLine;const h=Math.ceil(b*2+s.top+s.bottom+th+bh+(title.length&&body.length?s.gap:0));const angle=s.rotation*Math.PI/180,shadow=s.shadow?10:0,pad=4;const minX=Math.min(0,shadow),maxX=Math.max(w,w+shadow),minY=0,maxY=h+shadow;const points=[[minX,minY],[maxX,minY],[maxX,maxY],[minX,maxY]].map(([x,y])=>[x*Math.cos(angle)-y*Math.sin(angle),x*Math.sin(angle)+y*Math.cos(angle)]);const x0=Math.min(...points.map(p=>p[0])),y0=Math.min(...points.map(p=>p[1]));const outW=Math.ceil(Math.max(...points.map(p=>p[0]))-x0+pad*2),outH=Math.ceil(Math.max(...points.map(p=>p[1]))-y0+pad*2);const scale=+s.scale;canvas.width=outW*scale;canvas.height=outH*scale;canvas.style.width=outW+'px';ctx.scale(scale,scale);if(!s.transparent){ctx.fillStyle=s.background;ctx.fillRect(0,0,outW,outH)}ctx.translate(pad-x0,pad-y0);ctx.rotate(angle);if(s.shadow){ctx.fillStyle='#33343a';ctx.fillRect(8,9,w,h)}ctx.fillStyle=s.border;ctx.fillRect(0,0,w,h);ctx.fillStyle=s.fill;ctx.fillRect(b,b,w-2*b,h-2*b);ctx.fillStyle=s.text;ctx.textBaseline='top';ctx.textAlign=s.align;const x=b+s.left+(s.align==='center'?inner/2:s.align==='right'?inner:0);let y=b+s.top;ctx.font=s.headingSize+'px "Lilita One",Roboto,sans-serif';title.forEach(line=>{ctx.fillText(line,x,y);y+=s.headingSize*s.headingLine});if(title.length&&body.length)y+=s.gap;ctx.font=s.bodySize+'px Roboto,sans-serif';body.forEach(line=>{ctx.fillText(line,x,y);y+=s.bodySize*s.bodyLine});el('dimensions').textContent=canvas.width+' × '+canvas.height+' px';el('backgroundLabel').hidden=s.transparent;el('download').disabled=!fontReady;}
populate();render();
el('controls').addEventListener('input',()=>{read();render()});
el('preset').addEventListener('change',()=>{const p=presets[+el('preset').value];state.heading=p[0];state.body=p[1];populate();read();render()});
el('reset').addEventListener('click',()=>{state={...defaults};el('preset').value='0';populate();read();render();el('status').textContent='Site style restored.'});
el('download').addEventListener('click',()=>{read();render();canvas.toBlob(blob=>{if(!blob){el('status').textContent='Export failed. Please try again.';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='geck-rekt-'+(state.heading.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'card')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);el('status').textContent='PNG exported at '+canvas.width+' × '+canvas.height+' pixels.'},'image/png')});
el('status').textContent='Loading card fonts…';
Promise.all([document.fonts.load('37px "Lilita One"'),document.fonts.load('16px Roboto')]).then(()=>{fontReady=true;el('status').textContent=document.fonts.check('37px "Lilita One"')?'Ready to export.':'Heading font unavailable; using Roboto. Preview and export match.';render()}).catch(()=>{fontReady=true;el('status').textContent='Using fallback fonts. Preview and export match.';render()});
</script>
</body></html>
